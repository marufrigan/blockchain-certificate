  <text x="780" y="448" text-anchor="middle" class="label">Verify</text>
  <text x="780" y="466" text-anchor="middle" class="label">(view)</text>

  <text x="460" y="500" text-anchor="middle" class="subtitle">Verify is off-chain (view function)  no gas on-chain</text>
